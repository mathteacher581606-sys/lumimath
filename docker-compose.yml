services:
  postgres:
    image: postgres:16-alpine
    container_name: lumimath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumimath
      POSTGRES_PASSWORD: lumimath_pass
      POSTGRES_DB: lumimath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumimath"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lumimath-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lumimath-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  latex:
    build:
      context: ./apps/latex-service
      dockerfile: Dockerfile
    container_name: lumimath-latex
    restart: unless-stopped
    ports:
      - "8080:8080"
    mem_limit: 2g
    cpus: 2.0

volumes:
  pgdata:
  redisdata:
  miniodata:
